<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>LifeVault – Your Life, One Place</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<style>
:root{--bg:#faf6ef;--card:#fff;--ink:#14213d;--mut:#6b7385;--line:#ece5d8;--teal:#2a9d8f;--green:#6bbf59;--amb:#f4a261;--cor:#e76f51;--vio:#7b6fd0;--sh:0 2px 10px rgba(20,33,61,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1626;--card:#17233b;--ink:#f1ece2;--mut:#9aa5bb;--line:#26344f;--sh:0 2px 10px rgba(0,0,0,.35)}}
:root[data-theme=dark]{--bg:#0e1626;--card:#17233b;--ink:#f1ece2;--mut:#9aa5bb;--line:#26344f;--sh:0 2px 10px rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}h1,h2,h3{margin:0}h1{font-size:22px}h2{font-size:17px}h3{font-size:15px}
#app{display:flex;height:100%}aside{width:230px;background:#14213d;color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.logo{display:flex;gap:10px;align-items:center;font-weight:700;font-size:18px;padding:4px 10px 18px}.logo i{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--teal),var(--green));display:grid;place-items:center;font-style:normal}
.nav{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;color:#c9d1e3;text-decoration:none;transition:.2s}.nav:hover{background:rgba(255,255,255,.08)}.nav.on{background:var(--teal);color:#fff}
main{flex:1;overflow:auto;padding:28px 32px 40px;-webkit-overflow-scrolling:touch}.wrap{max-width:1080px;margin:auto;animation:in .35s}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}.sub{color:var(--mut);font-size:14px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px}
.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:var(--sh);border:1px solid var(--line);transition:.2s}.card:hover{transform:translateY(-1px)}
.stat b{font-size:26px;display:block}.stat{border-left:5px solid var(--teal)}.stat.a{border-color:var(--amb)}.stat.g{border-color:var(--green)}.stat.v{border-color:var(--vio)}
.btn{background:var(--teal);color:#fff;border:0;padding:9px 16px;border-radius:12px;cursor:pointer;font-weight:600;transition:.15s}.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.96)}.btn.s{background:var(--bg);color:var(--ink);border:1px solid var(--line)}.btn.d{background:var(--cor)}.ic{border:0;background:none;cursor:pointer;font-size:16px;padding:4px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row .g{flex:1;min-width:0}.row .g div:first-child{font-weight:600;overflow:hidden;text-overflow:ellipsis}.done .g div:first-child{text-decoration:line-through;opacity:.5}
.tag{font-size:12px;padding:2px 9px;border-radius:99px;background:#2a9d8f22;color:var(--teal);font-weight:600;white-space:nowrap}.tag.high,.tag.exp{background:#e76f5125;color:var(--cor)}.tag.med{background:#f4a26130;color:#d1721f}.tag.low,.tag.inc{background:#6bbf5930;color:#3f8f2f}
.bar{height:9px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--green));border-radius:9px;transition:width .6s}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);border-color:transparent}input[type=checkbox]{width:auto}
.tools{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.tools>*{flex:1;min-width:120px}.tools .btn{flex:0}
.modal{position:fixed;inset:0;background:rgba(10,18,35,.55);display:grid;place-items:center;padding:16px;z-index:50;animation:in .2s}.modal form{background:var(--card);border-radius:20px;padding:22px;width:100%;max-width:440px;max-height:90%;overflow:auto;display:grid;gap:12px}
label{font-size:13px;color:var(--mut);display:grid;gap:4px}.err{color:var(--cor);font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal div{min-height:58px;padding:5px;border-radius:10px;background:var(--bg);cursor:pointer;font-size:13px}.cal .h{min-height:0;background:none;text-align:center;color:var(--mut);cursor:default}.cal .t{outline:2px solid var(--teal)}.cal .sel{background:var(--teal);color:#fff}.dot{display:inline-block;width:7px;height:7px;border-radius:9px;background:var(--amb);margin:1px}
.bars{display:flex;gap:8px;align-items:flex-end;height:120px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut)}.bars i{display:block;border-radius:6px 6px 0 0;background:var(--teal);margin-bottom:3px}
.empty{text-align:center;color:var(--mut);padding:22px 0}.lock{position:fixed;inset:0;background:linear-gradient(160deg,#14213d,#1d6f6a);display:grid;place-items:center;z-index:99;padding:20px}.lock form{background:var(--card);padding:28px;border-radius:22px;width:100%;max-width:360px;display:grid;gap:12px;text-align:center}
#splash{position:fixed;inset:0;background:#14213d;color:#fff;display:grid;place-items:center;z-index:100;font-size:26px;font-weight:700;transition:opacity .5s}
@media(max-width:800px){aside{position:fixed;bottom:0;left:0;right:0;width:auto;height:calc(62px + env(safe-area-inset-bottom,0px));padding:6px 6px env(safe-area-inset-bottom,0px);flex-direction:row;overflow-x:auto;z-index:20;gap:0}.logo{display:none}.nav{flex-direction:column;gap:0;font-size:11px;padding:6px 10px;min-width:64px;text-align:center}main{padding:18px 16px 90px}}
</style></head><body><div id="splash">🗝️ LifeVault</div><div id="app"></div><div id="ov"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KEY="lifevault.v1",uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,"0"),ds=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),today=()=>ds(new Date());
const nice=s=>s?new Date(s+"T00:00").toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}):"";
const money=n=>(S.set.cur||"₹")+Number(n||0).toLocaleString();
let S={tasks:[],rem:[],docs:[],tx:[],goals:[],ppl:[],set:{theme:"auto",notif:false,budget:0,cur:"₹"}},unlocked=false,view="dash",cal={d:new Date(),sel:today(),mode:"month"},f={};
try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Storage full – delete large files")}}
const hash=async t=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode("lv:"+t)))].map(b=>pad(b.toString(16))).join("");
function toast(m){const t=document.createElement("div");t.textContent=m;t.style.cssText="position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#14213d;color:#fff;padding:10px 18px;border-radius:12px;z-index:200";document.body.append(t);setTimeout(()=>t.remove(),2500)}
/* recurrence */
function occurs(r,d){if(d<r.date)return false;const a=new Date(r.date+"T00:00"),b=new Date(d+"T00:00"),n=Math.round((b-a)/864e5);
 return r.rep=="daily"||(r.rep=="weekly"&&n%7==0)||(r.rep=="monthly"&&a.getDate()==b.getDate())||(r.rep=="yearly"&&a.getDate()==b.getDate()&&a.getMonth()==b.getMonth())||d==r.date}
function nextOcc(r){const d=new Date();for(let i=0;i<400;i++){const k=ds(d);if(occurs(r,k))return k;d.setDate(d.getDate()+1)}return null}
const bday=(p,d)=>p.bday&&p.bday.slice(5)==d.slice(5);
function eventsOn(d){return[...S.tasks.filter(t=>t.due==d).map(t=>({i:"✅",t:t.title,x:t.done})),...S.rem.filter(r=>occurs(r,d)).map(r=>({i:"🔔",t:r.title+(r.time?" · "+r.time:"")})),...S.ppl.filter(p=>bday(p,d)).map(p=>({i:"🎂",t:p.name+"’s birthday"}))]}
/* modal form builder with validation */
function form(title,fields,init,ok){const v=init||{};$("#ov").innerHTML=`<div class="modal"><form novalidate><h2>${title}</h2>${fields.map(x=>`<label>${x.l}${x.t=="select"?`<select name="${x.k}">${x.o.map(o=>`<option ${v[x.k]==o?"selected":""}>${o}</option>`)}</select>`:x.t=="textarea"?`<textarea name="${x.k}" rows="3" maxlength="500">${esc(v[x.k])}</textarea>`:x.t=="file"?`<input type="file" name="${x.k}">`:`<input name="${x.k}" type="${x.t||"text"}" maxlength="120" value="${esc(v[x.k])}" ${x.t=="number"?'step="any" min="0"':""}>`}</label>`).join("")}<div class="err"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn s" onclick="$('#ov').innerHTML=''">Cancel</button><button class="btn">Save</button></div></form></div>`;
 $("#ov form").onsubmit=async e=>{e.preventDefault();const o={};for(const x of fields){const el=e.target.elements[x.k];let val=x.t=="file"?el.files[0]:el.value.trim();
  if(x.r&&!val)return e.target.querySelector(".err").textContent=x.l+" is required";if(x.t=="number"&&val!==""&&!(+val>=0))return e.target.querySelector(".err").textContent=x.l+" must be a valid number";
  if(x.t=="file"&&val){if(val.size>1.5e6)return e.target.querySelector(".err").textContent="File must be under 1.5 MB";o.name=val.name;o.type=val.type;o.size=val.size;val=await new Promise(r=>{const fr=new FileReader;fr.onload=()=>r(fr.result);fr.readAsDataURL(val)})}o[x.k]=val}
  ok(o);save();$("#ov").innerHTML="";render()}}
const del=(k,id)=>{if(confirm("Delete this item?")){S[k]=S[k].filter(x=>x.id!=id);save();render()}};
const tog=id=>{const t=S.tasks.find(x=>x.id==id);t.done=!t.done;save();render()};
/* views */
const NAV=[["dash","🏠","Dashboard"],["tasks","✅","My Tasks"],["rem","🔔","Reminders"],["docs","🗂️","Vault"],["money","💰","Money"],["cal","📅","Calendar"],["ppl","👨‍👩‍👧","People"],["set","⚙️","Settings"]];
const head=(t,s,b)=>`<div class="top"><div><h1>${t}</h1><div class="sub">${s}</div></div>${b||""}</div>`;
const empty=m=>`<div class="empty">${m}</div>`;
const taskRow=t=>`<div class="row ${t.done?"done":""}"><input type="checkbox" ${t.done?"checked":""} onchange="tog('${t.id}')"><div class="g"><div>${esc(t.title)}</div><div class="sub">${esc(t.cat)}${t.due?" · "+nice(t.due):""}${t.who?" · "+esc(t.who):""}</div></div><span class="tag ${t.pri.toLowerCase().slice(0,3)}">${t.pri}</span><button class="ic" onclick="del('tasks','${t.id}')">🗑️</button></div>`;
const remRow=r=>{const n=nextOcc(r);return`<div class="row"><span>🔔</span><div class="g"><div>${esc(r.title)}</div><div class="sub">${r.cat} · ${n?nice(n):"Past"}${r.time?" · "+r.time:""}${r.rep!="none"?" · "+r.rep:""}</div></div><button class="ic" onclick="del('rem','${r.id}')">🗑️</button></div>`};
const V={
dash(){const d=today(),h=new Date().getHours(),m=d.slice(0,7),tx=S.tx.filter(x=>x.date.startsWith(m)),inc=tx.filter(x=>x.type=="Income").reduce((a,x)=>a+ +x.amt,0),exp=tx.filter(x=>x.type=="Expense").reduce((a,x)=>a+ +x.amt,0);
 const pend=S.tasks.filter(t=>!t.done),up=S.rem.map(r=>({r,n:nextOcc(r)})).filter(x=>x.n).sort((a,b)=>a.n<b.n?-1:1).slice(0,4);
 return head(`Good ${h<12?"morning":h<18?"afternoon":"evening"}, ${esc(S.set.name||"friend")} 👋`,new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"}))+
 `<div class="grid stats"><div class="card stat"><b>${pend.length}</b>Pending tasks</div><div class="card stat a"><b>${eventsOn(d).length}</b>Today’s events</div><div class="card stat g"><b>${money(inc-exp)}</b>Month balance</div><div class="card stat v"><b>${S.docs.length}</b>Documents</div></div>
 <div class="grid"><div class="card"><h2>Pending tasks</h2>${pend.slice(0,4).map(taskRow).join("")||empty("All clear 🎉")}</div>
 <div class="card"><h2>Upcoming reminders</h2>${up.map(x=>remRow(x.r)).join("")||empty("Nothing coming up")}</div>
 <div class="card"><h2>Finance this month</h2><p class="sub">Spent ${money(exp)} of ${S.set.budget?money(S.set.budget):"no budget set"}</p><div class="bar"><i style="width:${S.set.budget?Math.min(100,exp/S.set.budget*100):0}%"></i></div><p>Income <b style="color:var(--green)">${money(inc)}</b> · Expenses <b style="color:var(--cor)">${money(exp)}</b></p></div>
 <div class="card"><h2>Recent documents</h2>${S.docs.slice(-3).reverse().map(x=>`<div class="row"><span>📄</span><div class="g"><div>${esc(x.title)}</div><div class="sub">${esc(x.cat)}</div></div></div>`).join("")||empty("No documents yet")}</div></div>`},
tasks(){const q=(f.tq||"").toLowerCase(),l=S.tasks.filter(t=>(!f.tc||t.cat==f.tc)&&t.title.toLowerCase().includes(q)).sort((a,b)=>a.done-b.done||["High","Medium","Low"].indexOf(a.pri)-["High","Medium","Low"].indexOf(b.pri));
 return head("My Tasks",`${S.tasks.filter(t=>!t.done).length} open`,`<button class="btn" onclick="addTask()">+ New task</button>`)+`<div class="tools"><input placeholder="Search tasks…" value="${esc(f.tq)}" oninput="f.tq=this.value;render('tl')"><select onchange="f.tc=this.value;render()"><option value="">All categories</option>${TC.map(c=>`<option ${f.tc==c?"selected":""}>${c}</option>`)}</select></div><div class="card" id="tl">${l.map(taskRow).join("")||empty("No tasks yet — add your first one")}</div>`},
rem(){return head("Smart Reminders","Birthdays, bills, renewals & more",`<button class="btn" onclick="addRem()">+ New reminder</button>`)+`<div class="card">${S.rem.slice().sort((a,b)=>(nextOcc(a)||"z")<(nextOcc(b)||"z")?-1:1).map(remRow).join("")||empty("No reminders yet")}</div>${Notification.permission!="granted"?`<p class="sub">Enable notifications in Settings to get alerts.</p>`:""}`},
docs(){const q=(f.dq||"").toLowerCase(),l=S.docs.filter(x=>(!f.dc||x.cat==f.dc)&&x.title.toLowerCase().includes(q));
 return head("Document Vault","Stored privately on this device",`<button class="btn" onclick="addDoc()">+ Upload</button>`)+`<div class="tools"><input placeholder="Search documents…" value="${esc(f.dq)}" oninput="f.dq=this.value;render('dl')"><select onchange="f.dc=this.value;render()"><option value="">All types</option>${DC.map(c=>`<option ${f.dc==c?"selected":""}>${c}</option>`)}</select></div><div class="grid" id="dl">${l.map(x=>`<div class="card"><div style="font-size:30px">${x.type.startsWith("image")?`<img src="${x.file}" alt="" style="width:100%;height:120px;object-fit:cover;border-radius:12px">`:"📄"}</div><h3>${esc(x.title)}</h3><div class="sub">${esc(x.cat)} · ${(x.size/1024).toFixed(0)} KB</div><div style="display:flex;gap:6px;margin-top:8px"><button class="btn s" onclick="prev('${x.id}')">Preview</button><button class="btn d" onclick="del('docs','${x.id}')">Delete</button></div></div>`).join("")||empty("Your vault is empty")}</div>`},
money(){const m=today().slice(0,7),tx=S.tx.filter(x=>x.date.startsWith(m)),sum=(a,t)=>a.filter(x=>x.type==t).reduce((s,x)=>s+ +x.amt,0),inc=sum(tx,"Income"),exp=sum(tx,"Expense"),mo=[];
 for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const k=ds(d).slice(0,7),a=S.tx.filter(x=>x.date.startsWith(k));mo.push([d.toLocaleString(undefined,{month:"short"}),sum(a,"Income"),sum(a,"Expense")])}const mx=Math.max(1,...mo.flat().filter(x=>typeof x=="number"));
 return head("Money Manager","This month at a glance",`<button class="btn" onclick="addTx()">+ Transaction</button>`)+`<div class="grid stats"><div class="card stat g"><b>${money(inc)}</b>Income</div><div class="card stat a"><b>${money(exp)}</b>Expenses</div><div class="card stat"><b>${money(inc-exp)}</b>Balance</div></div>
 <div class="grid"><div class="card"><h2>6-month report</h2><div class="bars">${mo.map(x=>`<div><i style="height:${x[1]/mx*100}px"></i><i style="height:${x[2]/mx*100}px;background:var(--cor)"></i>${x[0]}</div>`).join("")}</div><p class="sub">Teal = income · Coral = expenses</p></div>
 <div class="card"><h2>Budget</h2><p class="sub">${S.set.budget?`${money(exp)} of ${money(S.set.budget)}`:"Set a monthly budget"}</p><div class="bar"><i style="width:${S.set.budget?Math.min(100,exp/S.set.budget*100):0}%"></i></div><button class="btn s" style="margin-top:10px" onclick="setBudget()">Set budget</button></div>
 <div class="card"><h2>Savings goals <button class="ic" onclick="addGoal()">＋</button></h2>${S.goals.map(g=>`<div style="margin:10px 0"><b>${esc(g.title)}</b> <span class="sub">${money(g.saved)} / ${money(g.target)}</span> <button class="ic" onclick="fund('${g.id}')">➕</button><button class="ic" onclick="del('goals','${g.id}')">🗑️</button><div class="bar"><i style="width:${Math.min(100,g.saved/g.target*100)}%"></i></div></div>`).join("")||empty("No goals yet")}</div></div>
 <div class="card" style="margin-top:16px"><h2>Transactions</h2>${S.tx.slice().sort((a,b)=>a.date<b.date?1:-1).slice(0,25).map(x=>`<div class="row"><span class="tag ${x.type.slice(0,3).toLowerCase()}">${x.type}</span><div class="g"><div>${esc(x.note||x.cat)}</div><div class="sub">${esc(x.cat)} · ${nice(x.date)}</div></div><b>${money(x.amt)}</b><button class="ic" onclick="del('tx','${x.id}')">🗑️</button></div>`).join("")||empty("No transactions yet")}</div>`},
cal(){const y=cal.d.getFullYear(),m=cal.d.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),sel=cal.sel;let cells="";
 if(cal.mode=="month"){cells=["S","M","T","W","T","F","S"].map(x=>`<div class="h">${x}</div>`).join("")+"<div></div>".repeat(first).replace(/<div>/g,'<div style="background:none;cursor:default">');for(let i=1;i<=n;i++){const k=y+"-"+pad(m+1)+"-"+pad(i),e=eventsOn(k);cells+=`<div class="${k==today()?"t":""} ${k==sel?"sel":""}" onclick="cal.sel='${k}';render()">${i}<br>${e.slice(0,3).map(()=>'<span class="dot"></span>').join("")}</div>`}}
 else{const s=new Date(sel+"T00:00");if(cal.mode=="week")s.setDate(s.getDate()-s.getDay());for(let i=0;i<(cal.mode=="week"?7:1);i++){const k=ds(s);cells+=`<div style="grid-column:1/-1;min-height:0"><b>${nice(k)}</b>${eventsOn(k).map(e=>`<div>${e.i} ${esc(e.t)}</div>`).join("")||'<div class="sub">Free</div>'}</div>`;s.setDate(s.getDate()+1)}}
 return head("Calendar",cal.d.toLocaleString(undefined,{month:"long",year:"numeric"}),`<div class="tools" style="margin:0;flex:0"><button class="btn s" onclick="cal.d.setMonth(cal.d.getMonth()-1);render()">‹</button><button class="btn s" onclick="cal.d=new Date();cal.sel=today();render()">Today</button><button class="btn s" onclick="cal.d.setMonth(cal.d.getMonth()+1);render()">›</button><select onchange="cal.mode=this.value;render()">${["month","week","day"].map(x=>`<option ${cal.mode==x?"selected":""}>${x}</option>`)}</select></div>`)+`<div class="grid"><div class="card" style="grid-column:span 2;min-width:0"><div class="cal">${cells}</div></div><div class="card"><h2>${nice(sel)}</h2>${eventsOn(sel).map(e=>`<div class="row"><span>${e.i}</span><div class="g"><div>${esc(e.t)}</div></div></div>`).join("")||empty("Nothing scheduled")}<button class="btn" onclick="addRem('${sel}')">+ Add event</button></div></div>`},
ppl(){return head("People & Family","Contacts, birthdays & emergency info",`<button class="btn" onclick="addPerson()">+ Add person</button>`)+`<div class="grid">${S.ppl.map(p=>`<div class="card"><h3>${p.emerg=="Yes"?"🚨 ":""}${esc(p.name)}</h3><div class="sub">${esc(p.rel)}</div><p>${p.phone?`📞 <a href="tel:${esc(p.phone)}">${esc(p.phone)}</a><br>`:""}${p.email?"✉️ "+esc(p.email)+"<br>":""}${p.bday?"🎂 "+nice(p.bday)+"<br>":""}${esc(p.notes)}</p><button class="btn d" onclick="del('ppl','${p.id}')">Delete</button></div>`).join("")||empty("Add family and important contacts")}</div>`},
set(){return head("Settings","Profile, security & data")+`<div class="grid"><div class="card"><h2>Profile & theme</h2><label>Name<input value="${esc(S.set.name)}" maxlength="60" onchange="S.set.name=this.value.trim();save()"></label><br><label>Theme<select onchange="S.set.theme=this.value;save();theme()">${["auto","light","dark"].map(x=>`<option ${S.set.theme==x?"selected":""}>${x}</option>`)}</select></label><br><label>Currency symbol<input value="${esc(S.set.cur)}" maxlength="3" onchange="S.set.cur=this.value||'₹';save()"></label></div>
 <div class="card"><h2>Security</h2><p class="sub">${S.set.pin?"PIN lock is on":"No PIN set"}. Data stays on this device.</p><button class="btn" onclick="setPin()">${S.set.pin?"Change":"Set"} PIN</button> ${S.set.pin?`<button class="btn s" onclick="S.set.pin='';save();render()">Remove</button>`:""}</div>
 <div class="card"><h2>Notifications</h2><p class="sub">Status: ${Notification.permission}</p><button class="btn" onclick="askNotif()">Enable notifications</button></div>
 <div class="card"><h2>Install app</h2><p class="sub">Add LifeVault to your home screen.</p><button class="btn" id="inst" onclick="install()">Install App</button></div>
 <div class="card"><h2>Data</h2><button class="btn s" onclick="exp()">Export backup</button> <label class="btn s" style="display:inline-block;cursor:pointer">Import<input type="file" accept=".json" hidden onchange="imp(this.files[0])"></label> <button class="btn d" onclick="if(confirm('Erase ALL data?')){localStorage.removeItem(KEY);location.reload()}">Erase all</button></div></div>`}};
const TC=["Personal","Work","Health","Home","Finance","Family"],DC=["ID","Certificate","Insurance","Medical","Finance","Other"];
const addTask=()=>form("New task",[{k:"title",l:"Title",r:1},{k:"cat",l:"Category",t:"select",o:TC},{k:"pri",l:"Priority",t:"select",o:["High","Medium","Low"]},{k:"due",l:"Due date",t:"date"},{k:"who",l:"Assigned to"}],{pri:"Medium"},o=>S.tasks.push({id:uid(),done:false,...o}));
const addRem=d=>form("New reminder",[{k:"title",l:"Title",r:1},{k:"cat",l:"Type",t:"select",o:["Birthday","Appointment","Bill","Renewal","Important date"]},{k:"date",l:"Date",t:"date",r:1},{k:"time",l:"Time",t:"time"},{k:"rep",l:"Repeat",t:"select",o:["none","daily","weekly","monthly","yearly"]}],{date:d||today()},o=>S.rem.push({id:uid(),...o}));
const addDoc=()=>form("Upload document",[{k:"title",l:"Title",r:1},{k:"cat",l:"Type",t:"select",o:DC},{k:"file",l:"File (max 1.5 MB)",t:"file",r:1}],{},o=>S.docs.push({id:uid(),...o}));
const addTx=()=>form("Transaction",[{k:"type",l:"Type",t:"select",o:["Expense","Income"]},{k:"amt",l:"Amount",t:"number",r:1},{k:"cat",l:"Category",t:"select",o:["Salary","Food","Rent","Bills","Travel","Health","Shopping","Other"]},{k:"date",l:"Date",t:"date",r:1},{k:"note",l:"Note"}],{date:today()},o=>S.tx.push({id:uid(),...o}));
const addGoal=()=>form("Savings goal",[{k:"title",l:"Goal",r:1},{k:"target",l:"Target amount",t:"number",r:1}],{},o=>S.goals.push({id:uid(),saved:0,...o,target:+o.target||1}));
const fund=id=>form("Add savings",[{k:"a",l:"Amount",t:"number",r:1}],{},o=>S.goals.find(g=>g.id==id).saved+=+o.a);
const setBudget=()=>form("Monthly budget",[{k:"b",l:"Amount",t:"number",r:1}],{b:S.set.budget},o=>S.set.budget=+o.b);
const addPerson=()=>form("Add person",[{k:"name",l:"Name",r:1},{k:"rel",l:"Relationship",t:"select",o:["Family","Friend","Doctor","Colleague","Other"]},{k:"phone",l:"Phone"},{k:"email",l:"Email",t:"email"},{k:"bday",l:"Birthday",t:"date"},{k:"emerg",l:"Emergency contact",t:"select",o:["No","Yes"]},{k:"notes",l:"Notes",t:"textarea"}],{},o=>S.ppl.push({id:uid(),...o}));
const setPin=()=>form("Set PIN",[{k:"p",l:"4–8 digit PIN",r:1}],{},async o=>{if(!/^\d{4,8}$/.test(o.p))return toast("PIN must be 4–8 digits");S.set.pin=await hash(o.p);save();render()});
function prev(id){const x=S.docs.find(d=>d.id==id);$("#ov").innerHTML=`<div class="modal" onclick="if(event.target==this)this.innerHTML=''"><div class="card" style="max-width:700px;width:100%;max-height:90%;overflow:auto"><h2>${esc(x.title)}</h2>${x.type.startsWith("image")?`<img src="${x.file}" style="max-width:100%">`:x.type=="application/pdf"?`<iframe src="${x.file}" style="width:100%;height:60vh;border:0"></iframe>`:`<p class="sub">No preview for this type.</p>`}<br><a class="btn" style="text-decoration:none;display:inline-block" href="${x.file}" download="${esc(x.name)}">Download</a></div></div>`}
function exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({...S,set:{...S.set,pin:""}})]));a.download="lifevault-backup.json";a.click()}
function imp(file){if(!file)return;const r=new FileReader;r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.tasks))throw 0;S=Object.assign(S,d);save();render();toast("Imported")}catch(e){toast("Invalid backup file")}};r.readAsText(file)}
/* notifications + PWA */
async function askNotif(){const p=await Notification.requestPermission();S.set.notif=p=="granted";save();render()}
setInterval(()=>{if(Notification.permission!="granted")return;const d=today(),t=pad(new Date().getHours())+":"+pad(new Date().getMinutes());S.rem.forEach(r=>{if(occurs(r,d)&&(!r.time||r.time<=t)&&r.last!=d){r.last=d;save();try{new Notification("LifeVault: "+r.title,{body:r.cat})}catch(e){}}})},30000);
let dp;addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e});
async function install(){if(dp){dp.prompt();dp=null}else toast("Open in Chrome ⋮ menu → Install app / Add to Home screen")}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
function theme(){const r=document.documentElement;S.set.theme=="auto"?r.removeAttribute("data-theme"):r.dataset.theme=S.set.theme}
/* shell */
function render(only){if(only){const h=document.createElement("div");h.innerHTML=V[view]();$("#"+only).innerHTML=h.querySelector("#"+only).innerHTML;return}
 $("#app").innerHTML=`<aside><div class="logo"><i>🗝️</i>LifeVault</div>${NAV.map(n=>`<a class="nav ${view==n[0]?"on":""}" href="#${n[0]}"><span>${n[1]}</span>${n[2]}</a>`).join("")}</aside><main><div class="wrap">${V[view]()}</div></main>`}
function gate(){theme();const L=$("#ov");
 if(!S.set.setup){L.innerHTML=`<div class="lock"><form><h1>🗝️ Welcome to LifeVault</h1><p class="sub">Your life, one place. Set up your private vault.</p><input id="n" placeholder="Your name" maxlength="60"><input id="p" type="password" inputmode="numeric" placeholder="Optional PIN (4–8 digits)"><div class="err"></div><button class="btn">Get started</button></form></div>`;
  L.querySelector("form").onsubmit=async e=>{e.preventDefault();const n=$("#n").value.trim(),p=$("#p").value;if(!n)return $(".err").textContent="Please enter your name";if(p&&!/^\d{4,8}$/.test(p))return $(".err").textContent="PIN must be 4–8 digits";S.set.name=n;S.set.setup=1;if(p)S.set.pin=await hash(p);save();L.innerHTML="";unlocked=true;render()}}
 else if(S.set.pin&&!unlocked){L.innerHTML=`<div class="lock"><form><h1>🔒 LifeVault</h1><input id="p" type="password" inputmode="numeric" placeholder="Enter PIN" autofocus><div class="err"></div><button class="btn">Unlock</button></form></div>`;
  L.querySelector("form").onsubmit=async e=>{e.preventDefault();if(await hash($("#p").value)==S.set.pin){unlocked=true;L.innerHTML="";render()}else $(".err").textContent="Incorrect PIN"}}
 else{unlocked=true;render()}}
addEventListener("hashchange",()=>{view=location.hash.slice(1)in V?location.hash.slice(1):"dash";unlocked&&render()});
view=location.hash.slice(1)in V?location.hash.slice(1):"dash";gate();
setTimeout(()=>{$("#splash").style.opacity=0;setTimeout(()=>$("#splash").remove(),500)},700);
</script></body></html>
